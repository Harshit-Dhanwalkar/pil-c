name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libsdl2-dev
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -Werror"
      - name: Numerical tests against closed-form results
        run: make test
      - name: Every example runs and keeps its constraints
        run: make check
